<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAP 動画連携テスト版</title>
<style>
body{font-family:sans-serif;background:#13203f;color:#fff;margin:0;padding:10px;}
h2{color:#d4af37;font-size:16px;}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;border-radius:4px;border:none;}
button{background:#d4af37;color:#13203f;font-weight:bold;border:none;padding:10px;border-radius:4px;width:100%;margin:4px 0;cursor:pointer;}
#player{width:100%;aspect-ratio:16/9;margin:10px 0;}
.game-row{display:flex;justify-content:space-between;align-items:center;background:#1f2d52;padding:8px;border-radius:4px;margin:4px 0;}
.jump-btn{background:none;color:#d4af37;border:1px solid #d4af37;padding:4px 10px;border-radius:4px;cursor:pointer;}
</style>
</head>
<body>

<h2>①YouTube URLを入力</h2>
<input id="ytUrl" placeholder="https://youtube.com/watch?v=xxxx">
<button onclick="loadVideo()">動画を読み込む</button>

<div id="player"></div>

<h2>②ゲーム開始タイムスタンプを記録</h2>
<button onclick="recordTimestamp()">▶ 今の再生時間を記録</button>

<h2>③記録一覧（タップでジャンプ）</h2>
<div id="gameList"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let games = [];
let gameCount = 0;

function extractVideoId(url){
  const m = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function loadVideo(){
  const url = document.getElementById('ytUrl').value;
  const id = extractVideoId(url);
  if(!id){ alert('URLが正しくありません'); return; }
  if(player){
    player.loadVideoById(id);
  } else {
    player = new YT.Player('player', {
      videoId: id,
      playerVars: {playsinline:1}
    });
  }
}

function recordTimestamp(){
  if(!player || !player.getCurrentTime){ alert('動画を読み込んでください'); return; }
  gameCount++;
  const t = Math.floor(player.getCurrentTime());
  games.push({label:'第'+gameCount+'ゲーム', time:t});
  renderList();
}

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return m+':'+String(s).padStart(2,'0');
}

function renderList(){
  const el = document.getElementById('gameList');
  el.innerHTML = games.map((g,i)=>
    `<div class="game-row">
      <span>${g.label}（${formatTime(g.time)}）</span>
      <button class="jump-btn" onclick="jumpTo(${g.time})">再生</button>
    </div>`
  ).join('');
}

function jumpTo(sec){
  if(player) player.seekTo(sec, true);
}
</script>
</body>
</html>
