<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAP Singles</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STAP-S">
<meta name="theme-color" content="#0a2a1a">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'MS Gothic',monospace;background:#ddd;font-size:12px;}
button{cursor:pointer;font-family:inherit;touch-action:manipulation;border:1px solid #888;background:#eee;color:#333;border-radius:3px;}
#nav{display:flex;gap:3px;padding:4px 5px;background:#0a2a1a;position:fixed;top:0;left:0;right:0;z-index:100;}
#nav button{padding:5px 10px;font-size:11px;background:#1a4a2a;color:#ccc;border:1px solid #2a5a3a;}
#nav button.on{background:#fff9f0;color:#0a2a1a;font-weight:bold;}
.nb{margin-left:auto;background:#1a5a1a !important;color:#fff !important;border-color:#1a5a1a !important;}
#page-body{margin-top:36px;}
#sheet-wrap{background:#fff;border-bottom:2px solid #0a2a1a;padding:3px;}
.sh-title{text-align:center;font-size:11px;font-weight:bold;letter-spacing:1px;margin-bottom:2px;}
.sh-info{font-size:8px;color:#555;display:flex;justify-content:space-between;margin-bottom:2px;}
.sh-teams{display:grid;grid-template-columns:1fr 44px 1fr;border:1px solid #000;font-size:12px;}
.sh-tx{padding:3px 4px;font-weight:bold;color:#004400;border-right:1px solid #000;word-break:break-all;}
.sh-tc{font-size:7px;display:flex;align-items:center;justify-content:center;border-right:1px solid #000;color:#666;}
.sh-ty{padding:3px 4px;font-weight:bold;color:#660000;word-break:break-all;}
.sh-players{display:grid;grid-template-columns:1fr 44px 1fr;border:1px solid #000;border-top:none;font-size:10px;}
.sh-px{padding:2px 4px;color:#004400;border-right:1px solid #000;word-break:break-all;}
.sh-pc{border-right:1px solid #000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;}
.sh-py{padding:2px 4px;color:#660000;word-break:break-all;}
.sh-gc{font-size:11px;font-weight:bold;color:#0a2a1a;line-height:1.2;text-align:center;}
.sh-gl{font-size:7px;color:#888;text-align:center;line-height:1;}
.gb{border:1px solid #000;border-top:none;}
.gb.cur{background:#fffff4;}
.gb-head{display:grid;grid-template-columns:1fr 44px 1fr;border-bottom:1px solid #ccc;background:#f5f0e0;min-height:20px;}
.gh-left{display:flex;align-items:center;padding:1px 3px;gap:2px;border-right:1px solid #000;}
.gh-sc{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border-right:1px solid #000;}
.gh-right{display:flex;align-items:center;justify-content:flex-end;padding:1px 3px;gap:2px;}
.gnum{font-size:8px;font-weight:bold;color:#555;margin-right:2px;}
.sd{width:11px;height:11px;background:#cc9900;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:bold;color:#fff;flex-shrink:0;}
.sr{font-size:7px;color:#ccc;width:11px;text-align:center;flex-shrink:0;}
.gb-pts{display:grid;grid-template-columns:1fr 44px 1fr;}
.pts-col{display:flex;flex-direction:column;overflow-x:auto;}
.pts-col:first-child{border-right:1px solid #000;}
.pts-ctr{border-right:1px solid #000;}
.ptrow{display:flex;min-width:max-content;}
.pc{flex:none;width:22px;min-height:22px;border-right:1px dotted #ddd;border-bottom:1px dotted #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.pc:last-child{border-right:none;}
.pc.won{background:#c8ecc8;}.pc.lost{background:#ecc8c8;}
.pc .pm{font-size:10px;font-weight:bold;line-height:1;}
.pc .pr{font-size:5px;color:#fff;background:#555;padding:0 1px;border-radius:1px;line-height:1.2;white-space:nowrap;}
.sh-tot{display:grid;grid-template-columns:1fr 44px 1fr;border:1px solid #000;border-top:none;background:#f0ece0;font-size:9px;font-weight:bold;}
.st-x{padding:2px 3px;color:#004400;border-right:1px solid #000;}
.st-c{display:flex;align-items:center;justify-content:center;font-size:8px;border-right:1px solid #000;padding:1px;text-align:center;}
.st-y{padding:2px 3px;color:#660000;}
#status{background:#0a2a1a;color:#ffe;font-size:10px;padding:3px 6px;display:none;flex-wrap:wrap;gap:4px;align-items:center;}
.sbadge{background:#66e066;color:#003300;font-weight:bold;padding:1px 6px;border-radius:3px;font-size:10px;}
.pbadge{background:#fff;color:#0a2a1a;font-weight:bold;padding:1px 6px;border-radius:3px;font-size:10px;}
#input-wrap{background:#f0ece4;padding:5px;display:none;}
.iblock{background:#fff;border:1px solid #ddd;padding:6px;margin-bottom:4px;border-radius:4px;}
.ilabel{font-size:9px;color:#888;font-weight:bold;margin-bottom:3px;}
.sel-btn{padding:10px 6px;font-size:12px;border:1px solid #aaa;background:#f0f0f0;color:#555;border-radius:4px;white-space:normal;word-break:keep-all;min-height:44px;box-sizing:border-box;}
.sel-btn.on-green{background:#1a6a1a;color:#fff;border-color:#0a4a0a;font-weight:bold;}
.sel-btn.on-red{background:#8a1a1a;color:#fff;border-color:#5a0a0a;font-weight:bold;}
.sel-btn.on-orange{background:#8a5a0a;color:#fff;border-color:#5a3a0a;font-weight:bold;}
.sub-row{display:none;border-radius:3px;padding:4px 6px;margin-bottom:3px;}
.sub-row.active{display:block;}
.sub-row.green{background:#f0f8f0;border:1px solid #aaddaa;}
.sub-row.red{background:#fff0f0;border:1px solid #ffaaaa;}
.sel-status{font-size:10px;background:#fff9e0;border:1px solid #ccaa44;padding:3px 6px;border-radius:3px;margin-bottom:4px;color:#554400;}
.miss-note{font-size:9px;background:#fff0f0;border:1px solid #cc4444;padding:4px 6px;border-radius:3px;margin-bottom:4px;display:none;color:#880000;}
#srv-ui{background:#fff8e8;border:1px solid #e8c050;border-radius:4px;padding:5px 6px;margin-bottom:4px;display:none;}
#srv-ui .srv-lbl{font-size:9px;font-weight:bold;color:#7a5a00;margin-bottom:3px;}
#rsn-ui{display:none;}
#sig{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:4px;}
.tbox{border:2px solid #ccc;border-radius:4px;padding:5px;}
.tbox.xb{border-color:#1a5a1a;background:#f0fff4;}
.tbox.yb{border-color:#7a1a1a;background:#fff4f0;}
.ttl{font-size:10px;font-weight:bold;margin-bottom:4px;text-align:center;}
.ttl.x{color:#004400;}.ttl.y{color:#660000;}
.pb2{width:100%;padding:14px 4px;font-size:14px;font-weight:bold;border:1px solid #888;cursor:pointer;margin-bottom:4px;text-align:center;border-radius:4px;}
.pb2:active{filter:brightness(0.85);}
.pb2:disabled{background:#ddd !important;color:#aaa !important;border-color:#ccc !important;cursor:not-allowed;}
#act-row{display:flex;gap:4px;padding-bottom:5px;}
#act-row button{flex:1;padding:8px 4px;font-size:11px;}
#tab-analysis,#tab-history{display:none;background:#f0ece4;padding:5px;}
.anwrap{background:#fff;border:1px solid #ccc;padding:7px;border-radius:4px;}
.antitle{font-size:11px;font-weight:bold;border-bottom:2px solid #0a2a1a;padding-bottom:3px;margin-bottom:7px;color:#0a2a1a;}
.ansec{margin-bottom:10px;}
.ansh{font-size:10px;font-weight:bold;color:#fff;background:#0a2a1a;padding:2px 6px;margin-bottom:4px;border-radius:2px;}
.stbl{width:100%;border-collapse:collapse;font-size:9px;margin-bottom:3px;}
.stbl th{background:#f0ece0;padding:2px 3px;text-align:left;font-size:8px;border:1px solid #ddd;}
.stbl td{padding:2px 3px;border:1px solid #ddd;vertical-align:middle;}
.stbl tr:nth-child(even){background:#fafafa;}
.dbar{display:flex;height:8px;background:#eee;border-radius:2px;overflow:hidden;}
.bx{height:100%;background:#1a5a1a;min-width:0;}.by{height:100%;background:#7a1a1a;min-width:0;}
.folder-group{background:#fff;border:1px solid #ccc;border-radius:4px;margin-bottom:6px;overflow:hidden;}
.folder-hd{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#f5f0e0;border-bottom:1px solid #ddd;cursor:pointer;font-size:10px;font-weight:bold;color:#0a2a1a;}
.folder-hd .ficon{font-size:12px;}.folder-hd .fname{flex:1;}.folder-hd .fcnt{font-size:9px;color:#888;}
.folder-del{font-size:10px;padding:2px 6px;background:#c44;color:#fff;border:none;border-radius:2px;}
.folder-body{display:none;}.folder-body.open{display:block;}
.hcard{background:#fff;border-bottom:1px solid #eee;border-left:3px solid #0a2a1a;padding:7px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;}
.hcard-info{flex:1;}.hcard-info h4{font-size:11px;font-weight:bold;margin-bottom:2px;}.hcard-info p{font-size:9px;color:#555;}
.hcard-del{font-size:10px;padding:3px 7px;background:#c44;color:#fff;border:none;border-radius:2px;flex-shrink:0;}
.badge{background:#0a2a1a;color:#fff;font-size:10px;font-weight:bold;padding:1px 5px;margin-left:3px;border-radius:2px;}
.empty{text-align:center;padding:20px;color:#888;font-size:11px;}
#mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;overflow-y:auto;padding:10px;}
#mbox{background:#fff;border:2px solid #0a2a1a;padding:12px;max-width:400px;margin:0 auto;border-radius:4px;}
#mbox h3{font-size:12px;font-weight:bold;border-bottom:2px solid #0a2a1a;padding-bottom:3px;margin-bottom:8px;color:#0a2a1a;}
#mbox label{font-size:9px;color:#555;display:block;margin-bottom:1px;}
#mbox input,#mbox select{width:100%;border:1px solid #888;font-size:11px;font-family:inherit;padding:4px;margin-bottom:5px;background:#fff;border-radius:2px;}
.msec{background:#f8f8f8;border:1px solid #ddd;padding:7px;margin-bottom:7px;border-radius:3px;}
.msec h4{font-size:10px;font-weight:bold;margin-bottom:5px;}
.mg-btn{padding:5px 12px;font-size:11px;border:1px solid #aaa;background:#f0f0f0;color:#555;border-radius:3px;}
.mg-btn.on{background:#0a2a1a;color:#fff;font-weight:bold;}
.srv-btn{flex:1;padding:6px;font-size:11px;border:1px solid #aaa;background:#f0f0f0;color:#555;border-radius:3px;}
.srv-btn.on{background:#cc9900;color:#fff;font-weight:bold;}
.folder-add-row{display:flex;gap:4px;margin-bottom:5px;}
.folder-add-row input{flex:1;border:1px solid #aaa;font-size:11px;font-family:inherit;padding:4px;border-radius:2px;}
.folder-add-row button{padding:4px 10px;font-size:11px;background:#1a5a1a;color:#fff;border:none;border-radius:2px;}
.print-btn{padding:5px 10px;font-size:11px;background:#335;color:#fff;border:none;border-radius:3px;}
.memo-tag-btn{padding:4px 8px;font-size:10px;border:1px solid #7a9aba;background:#e8f0fa;color:#3a5a8a;border-radius:12px;cursor:pointer;}
.memo-entry{padding:7px 9px;border-bottom:1px solid #eee;position:relative;}
.memo-entry .me-time{font-size:8px;color:#aaa;margin-bottom:2px;}
.memo-entry .me-text{font-size:11px;color:#333;white-space:pre-wrap;line-height:1.6;word-break:break-all;}
.memo-entry .me-del{position:absolute;top:6px;right:6px;font-size:10px;background:none;border:1px solid #ddd;color:#aaa;border-radius:2px;padding:1px 5px;cursor:pointer;}
@media print{#nav,#status,#input-wrap,#tab-history,.no-print{display:none!important;}#page-body{margin-top:0;}body{background:#fff;}}
</style>
</head>
<body>
<div id="nav">
  <span style="color:#66e066;font-size:11px;font-weight:bold;letter-spacing:1px;padding:0 4px;align-self:center;">🎾 STAP-S</span>
  <button id="nav-record" class="on" onclick="showTab('record')">採点票</button>
  <button id="nav-analysis" onclick="showTab('analysis')">分析</button>
  <button id="nav-history" onclick="showTab('history')">履歴</button>
  <button class="nb" onclick="openModal()" style="padding:5px 10px;font-size:11px;">＋ 新規試合</button>
</div>
<div id="page-body">
  <div id="tab-record">
    <div id="no-msg" style="text-align:center;padding:40px;background:#fff;color:#888;font-size:11px;">
      🎾 STAP-S シングルス<br><br>
      <button onclick="openModal()" style="background:#0a2a1a;color:#fff;padding:10px 18px;font-size:13px;border-radius:4px;">＋ 新規試合を開始</button>
    </div>
    <div id="sheet-wrap" style="display:none;">
      <div class="sh-title">🎾 STAP-S　ソフトテニス シングルス ジャッジペーパー</div>
      <div class="sh-info"><span id="si-l"></span><span id="si-r"></span></div>
      <div id="sh-body"></div>
    </div>
    <div id="status"><span class="sbadge" id="srv-b">サーブ：-</span><span class="pbadge" id="sc-b">-</span></div>
    <div id="input-wrap">
      <div id="srv-ui">
        <div class="srv-lbl" id="srv-ui-lbl">🎾 ファーストサーブ</div>
        <div id="srv-player-info" style="font-size:10px;margin-bottom:4px;">
          <span id="srv-team-name" style="font-weight:bold;"></span>
        </div>
        <div id="srv-first-row">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:3px;">
            <button class="sel-btn on-orange" id="srvt-n" onclick="setSrvType('normal',this)">通常サーブ</button>
            <button class="sel-btn" id="srvt-c" onclick="setSrvType('cut',this)">カットサーブ</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:3px;">
            <button class="sel-btn" id="srv1-ok" onclick="setSrv1(true)">✓ イン</button>
            <button class="sel-btn" id="srv1-ng" onclick="setSrv1(false)">✕ フォルト</button>
          </div>
        </div>
        <div id="srv-second-row" style="display:none;margin-top:4px;">
          <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;">
            <span style="font-size:9px;color:#7a5a00;font-weight:bold;">🎾 セカンドサーブ</span>
            <button onclick="resetToFirst()" style="font-size:10px;padding:2px 8px;background:#5a4a0a;color:#fff;border:none;border-radius:3px;">← 戻る</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:3px;">
            <button class="sel-btn on-orange" id="srvt-n2" onclick="setSrvType2('normal',this)">通常サーブ</button>
            <button class="sel-btn" id="srvt-c2" onclick="setSrvType2('cut',this)">カットサーブ</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;">
            <button class="sel-btn" id="srv2-ok" onclick="setSrv2(true)">✓ イン</button>
            <button class="sel-btn" id="srv2-ng" onclick="setSrv2(false)">✕ DF</button>
          </div>
        </div>
        <div id="srv-rsn-back" style="display:none;margin-bottom:3px;">
          <button onclick="resetToFirst()" style="font-size:10px;padding:2px 8px;background:#5a4a0a;color:#fff;border:none;border-radius:3px;">← サーブに戻る</button>
        </div>
      </div>
      <div class="iblock">
        <div class="ilabel">理由</div>
        <div class="sel-status">選択中：<b id="sel-disp">-</b></div>
        <div id="rsn-ui">
          <div style="font-size:8px;color:#1a5a1a;font-weight:bold;margin-bottom:3px;">▶得点</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:3px;">
            <button class="sel-btn" id="rs1" onclick="selRsn('SA',this)">SAエース</button>
            <button class="sel-btn" id="rs7" onclick="selRsn('RA',this)">RAリターンエース</button>
            <button class="sel-btn" id="rs_sm" onclick="selRsn('SM',this)">スマッシュ</button>
            <button class="sel-btn" id="rs_str" onclick="selRsn('_STR',this)">ストローク▾</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:3px;">
            <button class="sel-btn" id="rs_vol" onclick="selRsn('_VOL',this)">ボレー▾</button>
          </div>
          <div class="sub-row green" id="sub-str">
            <div style="font-size:9px;color:#1a5a1a;font-weight:bold;margin-bottom:3px;">打法：</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
              <button class="sel-btn" id="str0" onclick="selStrType('FH')">フォア</button>
              <button class="sel-btn" id="str1" onclick="selStrType('BH')">バック</button>
              <button class="sel-btn" id="str2" onclick="selStrType('カット')">カット</button>
              <button class="sel-btn" id="str3" onclick="selStrType('シュート')">シュート</button>
              <button class="sel-btn" id="str4" onclick="selStrType('パッシング')">パッシング</button>
            </div>
          </div>
          <div class="sub-row green" id="sub-co">
            <div style="font-size:9px;color:#1a5a1a;font-weight:bold;margin-bottom:3px;">コース：</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
              <button class="sel-btn on-green" id="co0" onclick="sgSub('co','クロス',this,'co')">クロス</button>
              <button class="sel-btn" id="co1" onclick="sgSub('co','スト',this,'co')">スト</button>
              <button class="sel-btn" id="co2" onclick="sgSub('co','センター',this,'co')">センター</button>
              <button class="sel-btn" id="co3" onclick="sgSub('co','ロブ',this,'co')">ロブ</button>
              <button class="sel-btn" id="co4" onclick="sgSub('co','中ロブ',this,'co')">中ロブ</button>
            </div>
          </div>
          <div class="sub-row green" id="sub-vol">
            <div style="font-size:9px;color:#1a5a1a;font-weight:bold;margin-bottom:3px;">種別：</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
              <button class="sel-btn" id="vol0" onclick="selVolType('ボレー')">ボレー</button>
              <button class="sel-btn" id="vol1" onclick="selVolType('ローボレー')">ローボレー</button>
            </div>
          </div>
          <div style="font-size:8px;color:#8a1a1a;font-weight:bold;margin-bottom:3px;">▶失点</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:3px;">
            <button class="sel-btn" id="rs_miss" onclick="selRsn('_MISS',this)">ミス▾</button>
            <button class="sel-btn" id="rs6" onclick="selRsn('RE',this)">REレシーブミス</button>
          </div>
          <div class="sub-row red" id="sub-miss">
            <div style="font-size:9px;color:#8a1a1a;font-weight:bold;margin-bottom:3px;">種別：</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
              <button class="sel-btn" id="ms0" onclick="selMissType('UE')">UE(凡ミス)</button>
              <button class="sel-btn" id="ms1" onclick="selMissType('バックアウト')">バックアウト</button>
              <button class="sel-btn" id="ms2" onclick="selMissType('サイドアウト')">サイドアウト</button>
              <button class="sel-btn" id="ms3" onclick="selMissType('ネット')">ネット</button>
              <button class="sel-btn" id="ms4" onclick="selMissType('SME')">スマッシュミス</button>
            </div>
          </div>
        </div>
      </div>
      <div class="miss-note" id="miss-note"></div>
      <div id="sig"></div>
      <div id="act-row">
        <button onclick="undo()" style="background:#5a4a0a;color:#fff;">← 取消</button>
        <button onclick="openEdit()">✏️ 編集</button>
        <button onclick="openMemo()" style="background:#3a5a8a;color:#fff;">📝 メモ</button>
        <button onclick="doSave()">💾 保存</button>
        <button onclick="printRecord()" class="print-btn">🖨️ 印刷</button>
        <button onclick="showTab('analysis')">分析 →</button>
      </div>
    </div>
  </div>
  <div id="tab-analysis">
    <div style="padding:4px 0 4px 0;display:flex;gap:4px;" class="no-print">
      <button onclick="printAnalysis()" class="print-btn">🖨️ 分析を印刷</button>
    </div>
    <div id="an-out" class="anwrap"><p class="empty">データなし</p></div>
  </div>
  <div id="tab-history"><div id="hist-out"></div></div>
</div>

<!-- 新規試合モーダル -->
<div id="mov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;overflow-y:auto;padding:10px;">
  <div id="mbox">
    <h3>新規試合（シングルス）</h3>
    <div class="msec">
      <h4>▶ フォルダ</h4>
      <label>既存フォルダ</label>
      <select id="m-fol"><option value="">-- 未分類 --</option></select>
      <div style="font-size:9px;color:#888;margin-bottom:4px;">新規フォルダ：</div>
      <div class="folder-add-row">
        <input id="m-newf" placeholder="フォルダ名">
        <button onclick="addFolderFromModal()">追加</button>
      </div>
    </div>
    <label>大会名</label><input id="m-trn" placeholder="例：県大会予選">

<script>
var NUMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
var G={co:'クロス',rsn:'',fs:'X',mg:5,srv1:null,srv2:null,srvType:'normal',srvType2:'normal'};
var matches=[],cur=null,folders=[];

try{var _s=localStorage.getItem('stCS1');if(_s)matches=JSON.parse(_s);}catch(e){}
try{var _f=localStorage.getItem('stFS1');if(_f)folders=JSON.parse(_f);}catch(e){}

function persist(){
  try{localStorage.setItem('stCS1',JSON.stringify(matches));}catch(e){}
  try{localStorage.setItem('stFS1',JSON.stringify(folders));}catch(e){}
}
function winN(m){return Math.ceil(m.mg/2);}
function getSrv(m,g){return(g%2===0)?m.fs:(m.fs==='X'?'Y':'X');}
function pnX(m){return m.xname||'選手X';}
function pnY(m){return m.yname||'選手Y';}
var LOSE_RSN=['DF','UE','RE','SME','バックアウト','サイドアウト','ネット'];
function isLose(rsn){return LOSE_RSN.indexOf(rsn)>=0;}
var RSN_LABEL={'':'通常','SA':'SAエース','RA':'リターンエース','DF':'DF','RE':'REレシーブミス','SM':'スマッシュ','FH':'フォアST','BH':'バックST','カット':'カットST','シュート':'シュート','パッシング':'パッシング','ボレー':'ボレー','ローボレー':'ローボレー','UE':'UE凡ミス','バックアウト':'バックアウト','サイドアウト':'サイドアウト','ネット':'ネット','SME':'スマッシュミス'};
var STR_TYPES=['FH','BH','カット','シュート','パッシング'];
function isStr(rsn){return STR_TYPES.indexOf(rsn)>=0;}
var VOL_TYPES=['ボレー','ローボレー'];
function isVol(rsn){return VOL_TYPES.indexOf(rsn)>=0;}
function isFinalGame(m,g){return g===m.mg-1&&m.mg%2===1;}
function isGameOver(gx,gy,isFin){
  if(isFin){
    if(gx>=7&&gx-gy>=2)return'X';if(gy>=7&&gy-gx>=2)return'Y';
    if(gx===7&&gy<=5)return'X';if(gy===7&&gx<=5)return'Y';return null;
  }else{
    if(gx>=4&&gx-gy>=2)return'X';if(gy>=4&&gy-gx>=2)return'Y';
    if(gx===7||gy===7)return(gx>gy?'X':'Y');return null;
  }
}
function filt(arr,fn){var r=[];for(var i=0;i<arr.length;i++)if(fn(arr[i]))r.push(arr[i]);return r;}
function cnt(arr,fn){return filt(arr,fn).length;}

function updateSrvUI(){
  if(!cur)return;
  var g=cur.curG,sv=getSrv(cur,g);
  document.getElementById('srv-ui').style.display='block';
  document.getElementById('srv-second-row').style.display='none';
  ['srv1-ok','srv1-ng','srv2-ok','srv2-ng'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on-green','on-red');});
  G.srv1=null;G.srv2=null;G.srvType='normal';G.srvType2='normal';
  ['srvt-n','srvt-c','srvt-n2','srvt-c2'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on-orange');});
  var dn=document.getElementById('srvt-n');if(dn)dn.classList.add('on-orange');
  var dn2=document.getElementById('srvt-n2');if(dn2)dn2.classList.add('on-orange');
  document.getElementById('rsn-ui').style.display='none';
  document.getElementById('sig').style.display='none';
  document.getElementById('srv-rsn-back').style.display='none';
  var svName=sv==='X'?pnX(cur):pnY(cur);
  var snEl=document.getElementById('srv-team-name');
  snEl.textContent='サーバー：'+svName;
  snEl.style.color=sv==='X'?'#004400':'#660000';
  document.getElementById('srv-ui-lbl').textContent='🎾 ファーストサーブ';
  document.getElementById('srv-first-row').style.display='block';
}
function setSrvType(val,btn){
  G.srvType=val;
  ['srvt-n','srvt-c'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on-orange');});
  btn.classList.add('on-orange');
}
function setSrvType2(val,btn){
  G.srvType2=val;
  ['srvt-n2','srvt-c2'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on-orange');});
  btn.classList.add('on-orange');
}
function resetToFirst(){
  G.srv1=null;G.srv2=null;G.rsn='';
  ['srv1-ok','srv1-ng','srv2-ok','srv2-ng'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on-green','on-red');});
  document.getElementById('srv-second-row').style.display='none';
  document.getElementById('rsn-ui').style.display='none';
  document.getElementById('sig').style.display='none';
  document.getElementById('srv-rsn-back').style.display='none';
  document.getElementById('miss-note').style.display='none';
  hideAllSub();clearRsBtn();updateSelStatus();buildSIG();
}
function setSrv1(isIn){
  G.srv1=isIn;
  document.getElementById('srv1-ok').classList.toggle('on-green',isIn);
  document.getElementById('srv1-ng').classList.toggle('on-red',!isIn);
  document.getElementById('srv1-ok').classList.remove('on-red');
  document.getElementById('srv1-ng').classList.remove('on-green');
  if(isIn){
    document.getElementById('srv-second-row').style.display='none';
    document.getElementById('rsn-ui').style.display='block';
    document.getElementById('sig').style.display='grid';
    document.getElementById('srv-rsn-back').style.display='block';
    buildSIG();
  }else{
    document.getElementById('srv-second-row').style.display='block';
    document.getElementById('rsn-ui').style.display='none';
    document.getElementById('sig').style.display='none';
    document.getElementById('srv-rsn-back').style.display='none';
  }
}
function setSrv2(isIn){
  G.srv2=isIn;
  document.getElementById('srv2-ok').classList.toggle('on-green',isIn);
  document.getElementById('srv2-ng').classList.toggle('on-red',!isIn);
  if(isIn){
    document.getElementById('rsn-ui').style.display='block';
    document.getElementById('sig').style.display='grid';
    document.getElementById('srv-rsn-back').style.display='block';
    buildSIG();
  }else{
    G.rsn='DF';
    if(cur&&!cur.done){var g=cur.curG;var sv=getSrv(cur,g);recordPt(sv==='X'?'Y':'X',sv);}
  }
}
function hideAllSub(){['sub-str','sub-co','sub-vol','sub-miss'].forEach(function(id){document.getElementById(id).classList.remove('active');});}
function clearRsBtn(){['rs1','rs6','rs7','rs_str','rs_vol','rs_sm','rs_miss'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on','on-green','on-red','on-orange');});}
function selRsn(val,btn){
  clearRsBtn();hideAllSub();document.getElementById('miss-note').style.display='none';
  btn.classList.add('on-orange');
  if(val==='_STR'){G.rsn='';document.getElementById('sub-str').classList.add('active');}
  else if(val==='_VOL'){G.rsn='';document.getElementById('sub-vol').classList.add('active');}
  else if(val==='_MISS'){G.rsn='';document.getElementById('sub-miss').classList.add('active');document.getElementById('miss-note').style.display='block';document.getElementById('miss-note').innerHTML='⚠️ ミスしたプレーヤーを押す → 相手の得点として記録';}
  else if(val==='SA'){G.rsn='SA';if(cur&&!cur.done){var g=cur.curG;var sv=getSrv(cur,g);recordPt(sv,sv);}return;}
  else if(val==='RE'){G.rsn='RE';if(cur&&!cur.done){var g2=cur.curG;var sv2=getSrv(cur,g2);recordPt(sv2,sv2==='X'?'Y':'X');}return;}
  else if(val==='RA'){G.rsn='RA';if(cur&&!cur.done){var g3=cur.curG;var sv3=getSrv(cur,g3);var rv3=sv3==='X'?'Y':'X';recordPt(rv3,rv3);}return;}
  else{G.rsn=val;}
  buildSIG();updateSelStatus();
}
function selStrType(type){
  ['str0','str1','str2','str3','str4'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on','on-green','on-red','on-orange');});
  event.target.classList.add('on-green');G.rsn=type;
  document.getElementById('sub-co').classList.add('active');buildSIG();updateSelStatus();
}
function selVolType(type){
  ['vol0','vol1'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on','on-green','on-red','on-orange');});
  event.target.classList.add('on-green');G.rsn=type;buildSIG();updateSelStatus();
}
function selMissType(type){
  ['ms0','ms1','ms2','ms3','ms4'].forEach(function(id){var b=document.getElementById(id);if(b)b.classList.remove('on','on-green','on-red','on-orange');});
  event.target.classList.add('on-red');G.rsn=type;buildSIG();updateSelStatus();
}
function sgSub(key,val,btn,group){
  G[key]=val;
  document.querySelectorAll('[id^="'+group+'"]').forEach(function(b){b.classList.remove('on','on-green','on-red','on-orange');});
  btn.classList.add('on-green');updateSelStatus();
}
function updateSelStatus(){
  var rsn=G.rsn,rsnTxt=RSN_LABEL[rsn]||'通常',parts=['理由:'+rsnTxt];
  if(isStr(rsn))parts.push('コース:'+G.co);
  document.getElementById('sel-disp').textContent=parts.join('　');
}
function buildSIG(){
  if(!cur)return;
  var el=document.getElementById('sig');el.innerHTML='';
  var lose=isLose(G.rsn),rsnLabel=RSN_LABEL[G.rsn]||'通常',subLabel='';
  if(isStr(G.rsn))subLabel=' ['+G.co+']';
  var rsnUiVisible=document.getElementById('rsn-ui').style.display!=='none';
  var needRsn=rsnUiVisible&&G.rsn==='';
  [['X',false,pnX(cur)],['Y',true,pnY(cur)]].forEach(function(a){
    var team=a[0],isY=a[1],tname=a[2];
    var box=document.createElement('div');box.className='tbox '+(isY?'yb':'xb');
    var ttl=document.createElement('div');ttl.className='ttl '+(isY?'y':'x');
    if(needRsn){ttl.textContent='⬆️ 理由を選んでください';ttl.style.color='#aa6600';ttl.style.fontSize='10px';}
    else{ttl.textContent=lose?'❌ '+tname+' ミス（押す）':'✅ '+tname+' 得点';if(lose)ttl.style.fontSize='9px';}
    box.appendChild(ttl);
    var btn=document.createElement('button');btn.className='pb2';
    if(needRsn){btn.disabled=true;btn.textContent=tname;}
    else if(lose){btn.style.cssText=isY?'background:#f8d0d0;border-color:#aa1111;color:#660000;':'background:#d0f8d0;border-color:#116611;color:#004400;';btn.textContent='❌ '+tname+'がミス';}
    else{btn.style.cssText=isY?'background:#f8e0e0;border-color:#7a1a1a;color:#660000;':'background:#e0f8e0;border-color:#1a5a1a;color:#004400;';btn.textContent='○ '+tname+' '+rsnLabel+subLabel;}
    (function(t){
      btn.addEventListener('click',function(e){
        e.preventDefault();e.stopPropagation();if(needRsn)return;
        recordPt(lose?(t==='X'?'Y':'X'):t,t);
      });
    })(team);
    box.appendChild(btn);el.appendChild(box);
  });
}
function recordPt(winner,player){
  if(!cur||cur.done)return;
  var g=cur.curG,sv=getSrv(cur,g);
  if(cur.gX[g]==null)cur.gX[g]=0;if(cur.gY[g]==null)cur.gY[g]=0;
  var gIdx=(cur.gX[g]||0)+(cur.gY[g]||0);
  var autoCo=gIdx%2===0?'正クロス':'逆クロス';
  var pt={winner:winner,player:player,serve:sv,rsn:G.rsn,game:g,gIdx:gIdx,srv1:G.srv1,srv2:G.srv2,srvCo:autoCo,srvType:G.srv1===false?G.srvType2:G.srvType};
  if(isStr(G.rsn))pt.co=G.co;
  cur.points.push(pt);
  if(winner==='X')cur.gX[g]++;else cur.gY[g]++;
  var gx=cur.gX[g],gy=cur.gY[g],fin=isFinalGame(cur,g),goResult=isGameOver(gx,gy,fin);
  if(goResult){
    cur.gR[g]=goResult;if(goResult==='X')cur.totX++;else cur.totY++;
    if(cur.totX>=winN(cur)||cur.totY>=winN(cur))cur.done=true;
    else if(cur.curG<cur.mg-1)cur.curG++;else cur.done=true;
  }
  G.rsn='';document.getElementById('miss-note').style.display='none';
  hideAllSub();clearRsBtn();updateSelStatus();buildSIG();renderSheet();updateStatus();persist();
  if(!cur.done)updateSrvUI();
  else{document.getElementById('srv-ui').style.display='none';document.getElementById('rsn-ui').style.display='none';document.getElementById('sig').style.display='none';}
}
function undo(){
  if(!cur||!cur.points.length)return;
  var last=cur.points.pop();
  cur.gX=[];cur.gY=[];cur.gR=[];cur.totX=0;cur.totY=0;cur.done=false;
  cur.points.forEach(function(p){if(cur.gX[p.game]==null)cur.gX[p.game]=0;if(cur.gY[p.game]==null)cur.gY[p.game]=0;if(p.winner==='X')cur.gX[p.game]++;else cur.gY[p.game]++;});
  for(var g=0;g<cur.mg;g++){var gx=cur.gX[g]||0,gy=cur.gY[g]||0,ur=isGameOver(gx,gy,isFinalGame(cur,g));if(ur){cur.gR[g]=ur;if(ur==='X')cur.totX++;else cur.totY++;}}
  cur.curG=last.game;buildSIG();renderSheet();updateStatus();persist();if(!cur.done)updateSrvUI();
}
function doSave(){persist();alert('保存しました');}
function renderSheet(){
  if(!cur)return;
  var nx=pnX(cur),ny=pnY(cur);
  document.getElementById('si-l').textContent='第'+cur.court+'コート　'+cur.tournament;
  document.getElementById('si-r').textContent=cur.date+'　'+cur.mg+'Gマッチ';
  var body=document.getElementById('sh-body');body.innerHTML='';
  var tn=document.createElement('div');tn.className='sh-teams';
  tn.innerHTML='<div class="sh-tx">'+nx+'</div><div class="sh-tc">スコア</div><div class="sh-ty">'+ny+'</div>';
  body.appendChild(tn);
  var pl=document.createElement('div');pl.className='sh-players';

function runAI(){
  if(!cur||!cur.points.length)return;
  var el=document.getElementById('ai-out'),m=cur,nx=pnX(m),ny=pnY(m),pts=m.points;
  function c(fn){return cnt(pts,fn);}
  var total=pts.length,xW=c(function(p){return p.winner==='X';}),yW=total-xW;
  var dfX=c(function(p){return p.rsn==='DF'&&p.serve==='X';}),dfY=c(function(p){return p.rsn==='DF'&&p.serve==='Y';});
  var ueX=c(function(p){return p.rsn==='UE'&&p.winner==='Y';}),ueY=c(function(p){return p.rsn==='UE'&&p.winner==='X';});
  var reX=c(function(p){return p.rsn==='RE'&&p.winner==='Y';}),reY=c(function(p){return p.rsn==='RE'&&p.winner==='X';});
  var missX=dfX+ueX+reX,missY=dfY+ueY+reY;
  var winner=m.done?(m.totX>m.totY?'X':'Y'):null;
  var xRate=Math.round(xW/total*100),s1='【① 試合総評】\n';
  if(winner==='X')s1+=nx+'が'+m.totX+'-'+m.totY+'で勝利。';
  else if(winner==='Y')s1+=ny+'が'+m.totY+'-'+m.totX+'で勝利。';
  else s1+='試合進行中（'+m.totX+'-'+m.totY+'）。';
  s1+='\nポイント獲得率：'+nx+' '+xRate+'% / '+ny+' '+(100-xRate)+'%。';
  var s2='【② ミス分析】\n'+nx+'の失点：DF '+dfX+'、UE '+ueX+'、RE '+reX+'　計'+missX+'本。\n'+ny+'の失点：DF '+dfY+'、UE '+ueY+'、RE '+reY+'　計'+missY+'本。';
  if(dfX>2)s2+='\n'+nx+'はダブルフォルト'+dfX+'本、サーブ安定が急務。';
  if(dfY>2)s2+='\n'+ny+'はダブルフォルト'+dfY+'本、サーブ安定が急務。';
  var advX=[],advY=[];
  if(dfX>1)advX.push('サーブ安定（DF'+dfX+'本）');if(ueX>2)advX.push('ラリーミス削減');if(reX>2)advX.push('レシーブ強化');
  if(dfY>1)advY.push('サーブ安定（DF'+dfY+'本）');if(ueY>2)advY.push('ラリーミス削減');if(reY>2)advY.push('レシーブ強化');
  var s3='【③ アドバイス】\n'+nx+'へ：'+(advX.length?advX.join('、'):'現状維持')+'\n'+ny+'へ：'+(advY.length?advY.join('、'):'現状維持');
  el.innerHTML='<div style="background:#fffdf0;border:1px solid #ccaa44;border-radius:4px;padding:10px;font-size:10px;line-height:1.8;white-space:pre-wrap;color:#333;">'+(s1+'\n\n'+s2+'\n\n'+s3)+'</div>';
}

function buildHistory(){
  var el=document.getElementById('hist-out');el.innerHTML='';
  if(!matches.length){el.innerHTML='<div class="empty">履歴なし</div>';return;}
  var groups={},ORDER=[];
  matches.forEach(function(m){var fid=m.folderId||'__none__';if(!groups[fid]){groups[fid]=[];ORDER.push(fid);}groups[fid].push(m);});
  var seen={};ORDER=ORDER.filter(function(x){if(seen[x])return false;seen[x]=true;return true;});
  ORDER.forEach(function(fid){
    var ms=groups[fid],fname='未分類';
    if(fid!=='__none__'){var f=filt(folders,function(x){return String(x.id)===String(fid);})[0];if(f)fname=f.name;}
    var wrap=document.createElement('div');wrap.className='folder-group';
    var hd=document.createElement('div');hd.className='folder-hd';
    hd.innerHTML='<span class="ficon">📁</span><span class="fname">'+fname+'</span><span class="fcnt">'+ms.length+'試合</span>';
    var body=document.createElement('div');body.className='folder-body open';
    hd.onclick=function(){body.classList.toggle('open');};
    if(fid!=='__none__'){
      var delBtn=document.createElement('button');delBtn.className='folder-del no-print';delBtn.textContent='削除';
      (function(foldId){delBtn.onclick=function(e){e.stopPropagation();if(!confirm('フォルダを削除しますか？'))return;folders=filt(folders,function(x){return String(x.id)!==String(foldId);});matches.forEach(function(m){if(String(m.folderId)===String(foldId))m.folderId=null;});persist();buildHistory();};})(fid);
      hd.appendChild(delBtn);
    }
    wrap.appendChild(hd);
    ms.forEach(function(m){
      var nx=pnX(m),ny=pnY(m),card=document.createElement('div');card.className='hcard';
      var info=document.createElement('div');info.className='hcard-info';
      info.innerHTML='<h4>'+m.tournament+' <span class="badge">'+m.totX+'-'+m.totY+'</span> '+(m.done?(m.totX>m.totY?'<span style="color:#004400;">'+nx+'勝</span>':'<span style="color:#660000;">'+ny+'勝</span>'):'進行中')+'</h4><p>'+m.date+' | '+nx+' vs '+ny+' | '+m.court+'番コート | '+m.points.length+'pt</p>';
      var mDel=document.createElement('button');mDel.className='hcard-del no-print';mDel.textContent='✕';
      (function(mm){
        mDel.onclick=function(e){e.stopPropagation();if(!confirm('この試合を削除しますか？'))return;matches=filt(matches,function(x){return x.id!==mm.id;});if(cur&&cur.id===mm.id)cur=matches[0]||null;persist();buildHistory();if(cur)showMatchUI();else{document.getElementById('no-msg').style.display='block';document.getElementById('sheet-wrap').style.display='none';document.getElementById('status').style.display='none';document.getElementById('input-wrap').style.display='none';}};
        info.onclick=function(){cur=mm;showMatchUI();showTab('record');};
      })(m);
      card.appendChild(info);card.appendChild(mDel);body.appendChild(card);
    });
    wrap.appendChild(body);el.appendChild(wrap);
  });
}

function printRecord(){
  var an=document.getElementById('tab-analysis'),hi=document.getElementById('tab-history'),rec=document.getElementById('tab-record');
  var anD=an.style.display,hiD=hi.style.display;an.style.display='none';hi.style.display='none';rec.style.display='block';
  window.print();setTimeout(function(){an.style.display=anD;hi.style.display=hiD;},500);
}
function printAnalysis(){
  buildAnalysis();
  var an=document.getElementById('tab-analysis'),hi=document.getElementById('tab-history'),rec=document.getElementById('tab-record');
  var recD=rec.style.display,hiD=hi.style.display;an.style.display='block';hi.style.display='none';rec.style.display='none';
  window.print();setTimeout(function(){rec.style.display=recD;hi.style.display=hiD;an.style.display='none';},500);
}
function openMemo(){if(!cur)return;renderMemoList();document.getElementById('memo-txt').value='';document.getElementById('mov-memo').style.display='block';setTimeout(function(){document.getElementById('memo-txt').focus();},100);}
function closeMemo(){document.getElementById('mov-memo').style.display='none';}
function insertTag(tag){var ta=document.getElementById('memo-txt'),v=ta.value,prefix=(v&&!v.endsWith('\n'))?'\n':'';ta.value=v+prefix+tag+' ';ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
function addMemoEntry(){
  var ta=document.getElementById('memo-txt'),text=(ta.value||'').trim();if(!text)return;
  if(!cur.memos)cur.memos=[];
  var now=new Date(),ts=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+(('0'+now.getDate()).slice(-2))+' '+(('0'+now.getHours()).slice(-2))+':'+(('0'+now.getMinutes()).slice(-2));
  var gInfo=cur.curG!=null?'G'+(cur.curG+1)+' '+pnX(cur)+':'+(cur.gX[cur.curG]||0)+'-'+pnY(cur)+':'+(cur.gY[cur.curG]||0):'';
  cur.memos.push({id:Date.now(),ts:ts,gInfo:gInfo,text:text});ta.value='';persist();renderMemoList();
}
function deleteMemoEntry(id){if(!cur||!cur.memos)return;cur.memos=filt(cur.memos,function(m){return m.id!==id;});persist();renderMemoList();}
function renderMemoList(){
  var el=document.getElementById('memo-list');
  if(!cur||!cur.memos||!cur.memos.length){el.innerHTML='<div style="text-align:center;padding:16px;color:#aaa;font-size:10px;">メモはまだありません</div>';return;}
  el.innerHTML='';
  cur.memos.slice().reverse().forEach(function(m){
    var d=document.createElement('div');d.className='memo-entry';
    var tagHtml=m.text.replace(/(⚡得点|❌ミス|🎾サーブ|💡気づき|⚠️課題)/g,'<span style="background:#e8f0fa;color:#3a5a8a;border-radius:3px;padding:0 3px;font-size:10px;font-weight:bold;">$1</span>');
    d.innerHTML='<div class="me-time">'+m.ts+(m.gInfo?' ｜ '+m.gInfo:'')+'</div><div class="me-text">'+tagHtml+'</div>';
    var del=document.createElement('button');del.className='me-del';del.textContent='✕';
    (function(mid){del.onclick=function(){deleteMemoEntry(mid);};})(m.id);
    d.appendChild(del);el.appendChild(d);
  });
}
setMG(5);
if(matches.length){cur=matches[0];showMatchUI();}
</script>
